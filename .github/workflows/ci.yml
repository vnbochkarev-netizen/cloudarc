name: CloudArc CI

on:
  push:
  pull_request:

jobs:
  test-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: CloudArc helper smoke
        run: |
          python -B skills/cloudarc-bounded-memory-benchmark/scripts/cloudarc_benchmark.py \
            smoke \
            --repo . \
            --size-mib 64 \
            --file-count 512 \
            --file-size-kib 16 \
            --duplicate-groups 32 \
            --json-output benchmarks/results/ci-smoke.json \
            --markdown-output docs/LARGE_PACKAGE_BENCHMARK_CI.md \
            --multi-json-output benchmarks/results/ci-multi-file.json \
            --multi-markdown-output docs/MULTI_FILE_BENCHMARK_CI.md
      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudarc-ci-smoke
          if-no-files-found: error
          path: |
            benchmarks/results/ci-smoke.json
            benchmarks/results/ci-multi-file.json
            docs/LARGE_PACKAGE_BENCHMARK_CI.md
            docs/MULTI_FILE_BENCHMARK_CI.md
