[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vibo-cloudarc"
version = "1.4.1"
description = "Safe CloudArc CLI with a portable VIBO container reference backend"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Optional accelerators. The reference backend works without them.
zstd = ["zstandard>=0.22"]
semantic = ["fastembed>=0.5", "usearch>=2.15"]

[project.scripts]
cloudarc = "cloudarc:main"
cloudarc-benchmark = "benchmarks.large_package:main"

[tool.setuptools]
py-modules = ["cloudarc", "config"]
packages = ["core", "cloud", "stats", "benchmarks"]
