[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vibo-cloudarc"
version = "1.4.2"
description = "Pack a 10 GiB folder into one .vibo archive at a flat ~26 MiB peak RSS, and read its index over HTTP without fetching the payload"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
keywords = ["archive", "bounded-memory", "streaming", "compression", "cli", "knowledge-base", "http-range", "vibo"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Archiving",
  "Topic :: System :: Archiving :: Compression",
]

[project.urls]
Homepage = "https://github.com/vnbochkarev-netizen/cloudarc"
Repository = "https://github.com/vnbochkarev-netizen/cloudarc"
Issues = "https://github.com/vnbochkarev-netizen/cloudarc/issues"
Changelog = "https://github.com/vnbochkarev-netizen/cloudarc/releases"

[project.optional-dependencies]
# Optional accelerators. The reference backend works without them.
zstd = ["zstandard>=0.22"]
semantic = ["fastembed>=0.5", "usearch>=2.15"]

[project.scripts]
cloudarc = "cloudarc:main"
cloudarc-benchmark = "benchmarks.large_package:main"

[tool.setuptools]
py-modules = ["cloudarc", "config"]
packages = ["core", "cloud", "stats", "benchmarks"]
